<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="limePanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99ce42"/>
      <stop offset="100%" stop-color="#a8d957"/>
    </linearGradient>
    <linearGradient id="slateBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b2e"/>
      <stop offset="100%" stop-color="#3f456b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e7e8ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Split IG Cover Layout: Top Lime + Bottom Deep Slate-Navy -->
  <rect width="640" height="236" fill="url(#limePanel)"/>
  <rect y="236" width="640" height="124" fill="url(#slateBottom)"/>
  <rect y="236" width="640" height="124" fill="url(#grid)"/>

  <!-- Signature 4-Point Diamond Star + Double-Line Corner Frame in Slate Indigo -->
  <g stroke="#555c8a" stroke-opacity="0.82" stroke-width="1.6" fill="none">
    <polyline points="602,108 602,216 462,216"/>
    <polyline points="592,120 592,206 474,206" stroke-opacity="0.5"/>
  </g>
  <path d="M602 96 L606 105 L615 108 L606 111 L602 120 L598 111 L589 108 L598 105 Z" fill="#555c8a"/>
  <path d="M458 207 L461 213 L467 216 L461 219 L458 225 L455 219 L449 216 L455 213 Z" fill="#555c8a"/>

  <!-- Subject Artwork in Bottom Slate-Navy Band -->
  <g opacity="0.4" stroke="#99ce42" stroke-width="2.2" fill="none">
    <line x1="400" y1="335" x2="600" y2="335"/>
    <line x1="430" y1="250" x2="430" y2="345"/>
    <path d="M430 330 C465 322, 505 274, 575 252"/>
    <line x1="455" y1="312" x2="565" y2="266" stroke="#e7e8ff" stroke-dasharray="5,4"/>
  </g>
  <text x="450" y="328" font-family="Georgia, serif" font-size="22" fill="#e7e8ff" opacity="0.38">dy/dx = f'(x) • nCr</text>

  <!-- Top-Right Flame + Elevencia Watermark -->
  <g transform="translate(548, 24)">
    <path d="M18 0 L28 13 L18 30 L8 13 Z" fill="#f6981e"/>
    <path d="M18 7 L23 13.5 L18 22 L13 13.5 Z" fill="#99ce42"/>
    <text x="18" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#181b2e">Elevencia</text>
  </g>

  <!-- Top Badge & Syllabus Pill -->
  <rect x="34" y="30" width="215" height="32" rx="16" fill="#181b2e"/>
  <text x="141" y="51" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#99ce42">CAMBRIDGE IGCSE</text>
  <rect x="34" y="76" width="175" height="28" rx="6" fill="#555c8a"/>
  <text x="48" y="95" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6" fill="#ffffff">SYLLABUS 0606</text>

  <!-- Main Title -->
  <text x="34" y="166" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800" fill="#181b2e">Additional Mathematics</text>
  <text x="34" y="200" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#252945">Functions, Calculus, Vectors &amp; Combinatorics</text>

  <!-- Bottom White Rounded Pill -->
  <rect x="34" y="282" width="358" height="36" rx="18" fill="#ffffff"/>
  <circle cx="54" cy="300" r="8" fill="#e7e8ff" stroke="#555c8a" stroke-width="1.3"/>
  <line x1="46" y1="300" x2="62" y2="300" stroke="#555c8a" stroke-width="1.1"/>
  <text x="68" y="304" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#181b2e">elevencia.torche.app</text>
  <rect x="204" y="291" width="18" height="18" rx="5" fill="#555c8a"/>
  <rect x="206.5" y="293.5" width="13" height="13" rx="3.2" fill="none" stroke="#ffffff" stroke-width="1.35"/>
  <circle cx="213" cy="300" r="3.1" fill="none" stroke="#ffffff" stroke-width="1.35"/>
  <circle cx="217" cy="296" r="0.9" fill="#ffffff"/>
  <text x="229" y="304" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3f456b">@elevencia.learning</text>
</svg>
