<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1760"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="460" cy="110" r="110" fill="#8b5cf6" fill-opacity="0.18"/>
  <circle cx="150" cy="360" r="95" fill="#fbbf24" fill-opacity="0.12"/>

  <!-- Main Dashboard Window -->
  <rect x="65" y="45" width="470" height="330" rx="22" fill="url(#cardBg)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="65" y="45" width="470" height="44" rx="22" fill="#1e1038"/>
  <rect x="65" y="72" width="470" height="17" fill="#1e1038"/>
  <circle cx="92" cy="67" r="6" fill="#fbbf24"/>
  <circle cx="112" cy="67" r="6" fill="#a78bfa"/>
  <circle cx="132" cy="67" r="6" fill="#34d399"/>
  <text x="160" y="72" font-family="Rajdhani, Arial, sans-serif" font-size="14" font-weight="700" fill="#e9d5ff" letter-spacing="1">ELEVENCIA LIVE CLASSROOM • CAMBRIDGE IGCSE &amp; A-LEVEL</text>

  <!-- Graph / Math Card inside screen -->
  <rect x="92" y="108" width="245" height="150" rx="14" fill="#180c30" stroke="#7c3aed" stroke-opacity="0.5"/>
  <text x="108" y="132" font-family="Rajdhani, Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">CALCULUS &amp; PHYSICS LAB</text>
  <!-- Coordinate grid -->
  <line x1="112" y1="226" x2="316" y2="226" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="128" y1="150" x2="128" y2="238" stroke="#6d28d9" stroke-width="1.5"/>
  <!-- Smooth sine/exponential curve -->
  <path d="M128 220 Q168 155, 208 192 T308 152" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="208" cy="192" r="5" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="308" cy="152" r="5" fill="#fbbf24"/>
  <text x="190" y="246" font-family="Cairo, Arial, sans-serif" font-size="12" fill="#c4b5fd">dy/dx = lim(Δx→0) Δy/Δx</text>

  <!-- Right Side Subject Stack -->
  <rect x="355" y="108" width="155" height="44" rx="10" fill="url(#purplePill)" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="372" y="128" font-family="Rajdhani, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">MATHEMATICS</text>
  <text x="372" y="143" font-family="Cairo, Arial, sans-serif" font-size="11" fill="#f3e8ff">0580 • 0606 • 9709 • 9231</text>

  <rect x="355" y="161" width="155" height="44" rx="10" fill="url(#purplePill)" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="372" y="181" font-family="Rajdhani, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">PHYSICS &amp; CHEM</text>
  <text x="372" y="196" font-family="Cairo, Arial, sans-serif" font-size="11" fill="#f3e8ff">0625 • 9702 • 0620 • 9701</text>

  <rect x="355" y="214" width="155" height="44" rx="10" fill="url(#purplePill)" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="372" y="234" font-family="Rajdhani, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">BIO &amp; LANGUAGES</text>
  <text x="372" y="249" font-family="Cairo, Arial, sans-serif" font-size="11" fill="#f3e8ff">0610 • 9700 • EN • 中文</text>

  <!-- Bottom Progress / Past Paper Mastery Bar -->
  <rect x="92" y="274" width="418" height="78" rx="14" fill="#180c30" stroke="#fbbf24" stroke-opacity="0.4"/>
  <text x="112" y="300" font-family="Rajdhani, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">CAMBRIDGE PAST PAPER MASTERY TRACKER</text>
  <text x="435" y="300" font-family="Rajdhani, Arial, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">A* READY</text>
  <rect x="112" y="314" width="378" height="12" rx="6" fill="#2e1760"/>
  <rect x="112" y="314" width="330" height="12" rx="6" fill="url(#goldAccent)"/>
  <text x="112" y="341" font-family="Cairo, Arial, sans-serif" font-size="11" fill="#d8b4fe">100-Min Live Sessions • Annotated Slides • HD Recordings • 7-Day Tutor Q&amp;A</text>

  <!-- Floating Achievement Badge Bottom Left -->
  <rect x="28" y="330" width="185" height="78" rx="16" fill="#ffffff" stroke="#6c2bd9" stroke-width="2.5"/>
  <circle cx="62" cy="369" r="20" fill="#fef3c7"/>
  <path d="M62 356 L66 364 L75 365.5 L68.5 371.5 L70 380 L62 376 L54 380 L55.5 371.5 L49 365.5 L58 364 Z" fill="#f59e0b"/>
  <text x="92" y="365" font-family="Rajdhani, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e1038">9.5 / 10</text>
  <text x="92" y="384" font-family="Cairo, Arial, sans-serif" font-size="12" font-weight="600" fill="#6c2bd9">Student Rating</text>

  <!-- Floating Cambridge Badge Top Right -->
  <rect x="415" y="18" width="160" height="58" rx="14" fill="url(#goldAccent)"/>
  <text x="495" y="43" text-anchor="middle" font-family="Rajdhani, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e1038">IGCSE &amp; A-LEVEL</text>
  <text x="495" y="61" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="11" font-weight="700" fill="#3b1578">12 Specialized Courses</text>
</svg>
